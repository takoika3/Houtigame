<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1"
  >
  <title>星剣と魔導書のクロニクル</title>

  <style>
    :root {
      --purple: #6d54bd;
      --dark: #080a14;
      --gold: #f3bd4c;
      --war: #ef5664;
      --guard: #55d184;
      --magic: #6997ff;
      --fate: #bd6dec;
      --astral: #53dde2;
      --rebirth: #efd47d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #070912;
      color: white;
      font-family:
        system-ui,
        "Yu Gothic",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .game {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      margin: auto;
      padding-bottom: 76px;
      background: #111525;
      box-shadow: 0 0 45px black;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* 上部 */

    .top {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      background:
        linear-gradient(
          #7459c4,
          #392660
        );
      border-bottom: 3px solid #241840;
    }

    .profile,
    .wallet {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .profile small,
    .profile b {
      display: block;
    }

    .wallet span {
      padding: 7px;
      background: #2c214c;
      border: 2px solid #ffffff25;
      border-radius: 18px;
      font-size: 11px;
    }

    /* ステージ */

    .stage {
      padding: 8px;
      text-align: center;
      background:
        linear-gradient(
          #67c5eb,
          #92dce9
        );
      text-shadow: 0 2px #3b6c81;
    }

    .stage h1 {
      margin: 2px;
    }

    .route {
      max-width: 340px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: auto;
    }

    .route-bar {
      height: 9px;
      flex: 1;
      overflow: hidden;
      background: #40365f;
      border: 2px solid white;
      border-radius: 10px;
    }

    .route-bar i {
      display: block;
      height: 100%;
      background:
        linear-gradient(
          90deg,
          #ffe868,
          #ff9c38
        );
    }

    /* 戦闘画面 */

    .battle-field {
      height: 430px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          transparent 0 53%,
          #77b95d 53% 63%,
          #deb972 63%
        ),
        linear-gradient(
          #68c7eb,
          #c5eef1
        );
    }

    .battle-field::after {
      content: "";
      position: absolute;
      inset: 63% 0 0;
      opacity: 0.16;
      background:
        radial-gradient(
          circle,
          #835b2e 2px,
          transparent 3px
        );
      background-size: 32px 27px;
    }

    .enemy,
    .player {
      position: absolute;
      left: 50%;
      z-index: 5;
      text-align: center;
      transform: translateX(-50%);
    }

    .enemy {
      top: 30px;
    }

    .player {
      bottom: 24px;
      min-width: 230px;
    }

    .unit-name {
      display: inline-block;
      padding: 4px 13px;
      color: white;
      background:
        linear-gradient(
          #49374d,
          #291d31
        );
      border: 2px solid white;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 900;
    }

    .hp-shell {
      width: 210px;
      height: 17px;
      margin: 5px auto 2px;
      overflow: hidden;
      background: #29283a;
      border: 3px solid white;
      border-radius: 20px;
      box-shadow: 0 2px 7px #0006;
    }

    .hp-shell i {
      display: block;
      width: 100%;
      height: 100%;
      transition:
        width 0.3s,
        background 0.3s;
    }

    .enemy-hp i {
      background:
        linear-gradient(
          #ff8276,
          #d4263f
        );
    }

    .player-hp i {
      background:
        linear-gradient(
          #b5ffc7,
          #25bb61
        );
    }

    .player-hp.warning i {
      background:
        linear-gradient(
          #fff595,
          #dc9a23
        );
    }

    .player-hp.danger i {
      background:
        linear-gradient(
          #ffaea4,
          #c42038
        );
      animation:
        dangerPulse 0.65s
        infinite alternate;
    }

    @keyframes dangerPulse {
      to {
        filter: brightness(1.5);
      }
    }

    .hp-number {
      display: inline-block;
      padding: 2px 10px;
      color: #effff4;
      background: #153527d9;
      border: 1px solid #51d784;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 900;
    }

    .enemy .hp-number {
      color: #fff;
      background: #452330dc;
      border-color: #ff7781;
    }

    .enemy-art,
    .player-art {
      margin: 13px auto 0;
    }

    .enemy-art {
      width: 100px;
      height: 100px;
      animation:
        enemyFloat 1.6s
        infinite alternate;
    }

    .player-art {
      width: 75px;
      height: 75px;
    }

    @keyframes enemyFloat {
      to {
        transform:
          translateY(6px)
          rotate(3deg);
      }
    }

    .player.hit {
      animation:
        playerHit 0.3s;
    }

    @keyframes playerHit {
      25% {
        transform:
          translateX(calc(-50% - 9px));
      }

      50% {
        transform:
          translateX(calc(-50% + 8px));
      }

      75% {
        transform:
          translateX(calc(-50% - 5px));
      }
    }

    .effect,
    .damage-number {
      position: absolute;
      left: 50%;
      top: 43%;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
    }

    .effect {
      font-size: 90px;
    }

    .effect.show {
      animation:
        impact 0.45s;
    }

    @keyframes impact {
      30% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          scale(1.8)
          rotate(25deg);
      }
    }

    .damage-number {
      color: white;
      font-size: 30px;
      font-weight: 1000;
      text-shadow:
        0 3px #c54135;
    }

    .damage-number.show {
      animation:
        damagePopup 0.7s;
    }

    @keyframes damagePopup {
      20% {
        opacity: 1;
        transform:
          translateY(-10px)
          scale(1.2);
      }

      100% {
        opacity: 0;
        transform:
          translateY(-65px);
      }
    }

    .battle-log {
      padding: 9px 12px;
      color: #fff2b8;
      background: #293029;
      font-size: 11px;
    }

    .command {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background:
        linear-gradient(
          #674aa9,
          #3c2871
        );
    }

    .power {
      flex: 1;
      text-align: center;
    }

    .power b {
      display: block;
      color: #ffe567;
      font-size: 20px;
    }

    .boss-button {
      flex: 1.7;
      padding: 13px;
      color: #5b3516;
      background:
        linear-gradient(
          #ffea71,
          #e47e2b
        );
      border: 3px solid #fff2aa;
      border-radius: 16px;
      font-weight: 1000;
      font-size: 17px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 3px;
      padding: 4px;
      background: #2e2457;
    }

    .stats div {
      padding: 7px;
      text-align: center;
      background:
        linear-gradient(
          #55428e,
          #3e2e74
        );
      border-radius: 7px;
    }

    .stats small,
    .stats b {
      display: block;
    }

    .stats b {
      color: #ffe667;
    }

    .exp-panel {
      padding: 8px 11px;
      color: #63452a;
      background:
        linear-gradient(
          #ffe8b6,
          #e4c585
        );
      font-size: 11px;
    }

    .exp-bar {
      height: 10px;
      margin-top: 5px;
      overflow: hidden;
      background: #715638;
      border: 2px solid #fff4c7;
      border-radius: 20px;
    }

    .exp-bar i {
      display: block;
      height: 100%;
      background:
        linear-gradient(
          90deg,
          #61cfff,
          #7974ff
        );
    }

    .upgrades {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 5px;
      padding: 7px;
      background: #ddbe80;
    }

    .upgrade {
      min-height: 122px;
      min-width: 0;
      padding: 7px 3px;
      color: white;
      background:
        linear-gradient(
          #6659b7,
          #3a337a
        );
      border: 3px solid #fff1cf;
      border-radius:
        20px 20px 8px 8px;
    }

    .upgrade strong,
    .upgrade small {
      display: block;
    }

    .upgrade strong {
      color: #ffe66e;
    }

    .price {
      margin-top: 6px;
      padding: 4px;
      color: #49301d;
      background: #ffd354;
      border-radius: 6px;
      font-weight: 900;
    }

    /* 豪華紋章 */

    .rpg-icon {
      --c1: #70b9ff;
      --c2: #315cff;
      --c3: #101c51;
      --glow: #5091ffe6;

      position: relative;
      display: inline-grid;
      place-items: center;
      width: 52px;
      height: 52px;
      isolation: isolate;
      color: white;

      background:
        radial-gradient(
          circle at 30% 22%,
          white 0 3%,
          transparent 4%
        ),
        radial-gradient(
          circle,
          var(--c1),
          var(--c2) 27%,
          var(--c3) 62%,
          #050710 80%
        );

      border: 2px solid var(--c1);
      border-radius: 50%;

      box-shadow:
        inset 0 0 4px white,
        inset 0 0 10px var(--c1),
        0 0 0 3px #17131f,
        0 0 0 5px #95774a,
        0 0 10px var(--c1),
        0 0 22px var(--glow);

      font-family:
        Georgia,
        serif;
      font-size: 24px;
      font-weight: 900;

      text-shadow:
        0 0 4px white,
        0 0 12px var(--glow);
    }

    .rpg-icon::before {
      content: "";
      position: absolute;
      inset: -10px;
      z-index: -1;
      border: 1px solid #f4cc73cc;
      border-radius: 50%;

      background:
        conic-gradient(
          transparent 0 8deg,
          #f5d378 9deg 12deg,
          transparent 13deg 78deg,
          #f5d378 79deg 83deg,
          transparent 84deg 168deg,
          #f5d378 169deg 173deg,
          transparent 174deg 258deg,
          #f5d378 259deg 263deg,
          transparent 264deg 348deg,
          #f5d378 349deg 353deg,
          transparent 354deg
        );

      clip-path:
        polygon(
          50% 0,
          58% 14%,
          70% 7%,
          74% 22%,
          88% 14%,
          84% 31%,
          100% 50%,
          84% 58%,
          93% 72%,
          77% 73%,
          84% 88%,
          67% 83%,
          50% 100%,
          42% 86%,
          28% 94%,
          27% 77%,
          12% 87%,
          16% 68%,
          0 50%,
          16% 42%,
          7% 29%,
          23% 27%,
          16% 12%,
          33% 17%
        );
    }

    .rpg-icon.war {
      --c1: #ff795e;
      --c2: #d2283c;
      --c3: #4b0718;
      --glow: #ff2b36e6;
    }

    .rpg-icon.sword {
      --c1: #d5efff;
      --c2: #557fe0;
      --c3: #12244d;
      --glow: #408dffe6;
    }

    .rpg-icon.guard {
      --c1: #b9ffc5;
      --c2: #42b966;
      --c3: #123b22;
      --glow: #41e869d9;
    }

    .rpg-icon.magic {
      --c1: #e3a2ff;
      --c2: #8440d5;
      --c3: #260643;
      --glow: #b445fff2;
    }

    .rpg-icon.fate {
      --c1: #f0a1ff;
      --c2: #9145dc;
      --c3: #320958;
      --glow: #c94cfff2;
    }

    .rpg-icon.astral {
      --c1: #b5fcff;
      --c2: #3fc0d7;
      --c3: #06344a;
      --glow: #2fdcfff2;
    }

    .rpg-icon.rebirth {
      --c1: #fff3a3;
      --c2: #e5a33b;
      --c3: #614016;
      --glow: #ffbe3cf2;
    }

    .rpg-icon.death {
      --c1: #d47dff;
      --c2: #6921a8;
      --c3: #1e052d;
      --glow: #9930fff2;
    }

    .rpg-icon.fire {
      --c1: #ffe260;
      --c2: #ff6728;
      --c3: #5b0b05;
      --glow: #ff5016f2;
    }

    .rpg-icon.thunder {
      --c1: #fffaae;
      --c2: #58acff;
      --c3: #182b74;
      --glow: #4ca6fff2;
    }

    .rpg-icon.moon {
      --c1: #bfa8ff;
      --c2: #5939c9;
      --c3: #171447;
      --glow: #714dfff2;
    }

    .rpg-icon.small {
      width: 30px;
      height: 30px;
      font-size: 14px;
    }

    .rpg-icon.small::before {
      inset: -6px;
    }

    .rpg-icon.medium {
      width: 45px;
      height: 45px;
      font-size: 21px;
    }

    .rpg-icon.large {
      width: 67px;
      height: 67px;
      font-size: 31px;
    }

    /* スキルツリー */

    .tree-page {
      background: #050605;
    }

    .tree-header {
      height: 70px;
      display: grid;
      grid-template-columns:
        50px 1fr 80px;
      align-items: center;
      padding: 7px 11px;
      background:
        linear-gradient(
          #332617,
          #17110b
        );
      border-bottom: 2px solid #826536;
    }

    .tree-header h2 {
      margin: 2px;
      font-size: 17px;
    }

    .tree-header small {
      color: #cdb486;
      font-size: 9px;
    }

    .tree-back,
    .tree-tools button {
      height: 38px;
      color: #f6ddaa;
      background: #382b1b;
      border: 1px solid #8c6e3c;
      border-radius: 5px;
    }

    .tree-back {
      width: 42px;
      border-radius: 50%;
    }

    .tree-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 7px;
      background: #0e0c09;
    }

    .tree-search {
      flex: 1;
      display: flex;
      padding: 7px;
      background: #1a150e;
      border: 2px solid #755d34;
    }

    .tree-search input {
      width: 100%;
      color: white;
      background: transparent;
      border: 0;
      outline: 0;
    }

    .tree-tools {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tree-tools span {
      font-size: 10px;
    }

    .filters {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 6px;
      background: #090806;
    }

    .filters button {
      flex: 0 0 auto;
      padding: 6px 10px;
      color: #c6b696;
      background: #1b160f;
      border: 1px solid #584728;
      border-radius: 14px;
    }

    .filters button.active {
      color: #25180b;
      background: #e6b950;
    }

    .tree-viewport {
      height: calc(100vh - 278px);
      min-height: 540px;
      position: relative;
      overflow: hidden;
      touch-action: none;
      cursor: grab;

      background:
        radial-gradient(
          circle at center,
          #925f2e24,
          transparent 28%
        ),
        radial-gradient(
          circle,
          #e2be701f 1px,
          transparent 1.5px
        ),
        #050605;

      background-size:
        auto,
        46px 46px;
    }

    .tree-world {
      width: 3300px;
      height: 3300px;
      position: absolute;
      transform-origin: 0 0;
    }

    .tree-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tree-line {
      stroke: #564324;
      stroke-width: 3;
      opacity: 0.75;
    }

    .tree-line.available {
      stroke: #907441;
      stroke-width: 4;
    }

    .tree-line.active {
      stroke: #ffbd49;
      stroke-width: 6;
      filter:
        drop-shadow(
          0 0 5px
          #ff9e2d
        );
    }

    .tree-nodes {
      position: absolute;
      inset: 0;
    }

    .tree-node {
      width: 34px;
      height: 34px;
      position: absolute;
      display: grid;
      place-items: center;
      transform:
        translate(-50%, -50%);
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 50%;
    }

    .tree-node.medium {
      width: 48px;
      height: 48px;
    }

    .tree-node.major {
      width: 62px;
      height: 62px;
    }

    .tree-node.keystone {
      width: 82px;
      height: 82px;
    }

    .tree-node.core {
      width: 110px;
      height: 110px;
    }

    .tree-node .rpg-icon {
      width: 100%;
      height: 100%;
    }

    .tree-node.keystone
    .rpg-icon::before {
      animation:
        runeSpin 18s
        linear infinite;
    }

    @keyframes runeSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .tree-node.core .rpg-icon {
      --c1: #fff4a3;
      --c2: #ff9c32;
      --c3: #651b08;
      --glow: #ff8020f2;
      font-size: 42px;
      animation:
        corePulse 2s
        infinite alternate;
    }

    @keyframes corePulse {
      to {
        transform: scale(1.07);
        filter: brightness(1.2);
      }
    }

    .tree-node.locked .rpg-icon {
      opacity: 0.52;
      filter:
        grayscale(0.92)
        brightness(0.28);
    }

    .tree-node.available .rpg-icon {
      animation:
        nodeAvailable 1.25s
        infinite alternate;
    }

    @keyframes nodeAvailable {
      to {
        transform: scale(1.1);
        filter: brightness(1.4);
      }
    }

    .tree-node.owned .rpg-icon {
      border-color: #fff0a8;
      filter: brightness(1.2);
      box-shadow:
        inset 0 0 8px white,
        0 0 0 5px #e8b652,
        0 0 26px var(--glow);
    }

    .tree-node.maxed .rpg-icon {
      outline: 3px solid #fff09b;
      outline-offset: 6px;
    }

    .tree-node.selected .rpg-icon {
      outline: 2px solid white;
      outline-offset: 10px;
    }

    .tree-node.search-hit .rpg-icon {
      outline: 4px solid white;
      outline-offset: 10px;
    }

    .tree-node.filtered {
      opacity: 0.06;
      pointer-events: none;
    }

    .node-detail {
      width:
        min(
          660px,
          calc(100% - 18px)
        );
      position: fixed;
      left: 50%;
      bottom: 80px;
      z-index: 180;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      transform: translateX(-50%);
      background: #130f0af7;
      border: 3px solid #98733e;
      border-radius: 13px;
    }

    .node-detail p {
      margin: 3px;
      color: #d7c6a8;
      font-size: 11px;
    }

    .node-detail button {
      padding: 6px 13px;
      color: #30200d;
      background: #eabc56;
      border: 2px solid #ffedaa;
      border-radius: 7px;
      font-weight: 900;
    }

    /* ガチャ・転生 */

    .sub-header {
      height: 69px;
      display: grid;
      grid-template-columns:
        50px 1fr 75px;
      align-items: center;
      padding: 7px;
      background:
        linear-gradient(
          #664bad,
          #39276e
        );
    }

    .sub-header h2 {
      margin: 2px;
    }

    .summon-screen,
    .rebirth-screen {
      min-height: 520px;
      padding: 65px 20px;
      text-align: center;
      background:
        radial-gradient(
          circle,
          #735bc8,
          #17152f 65%
        );
    }

    .summon-screen .rpg-icon,
    .rebirth-screen .rpg-icon {
      margin: 25px;
    }

    .summon-actions {
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 8px;
      padding: 10px;
    }

    .summon-actions button,
    .rebirth-button {
      padding: 15px;
      color: white;
      background:
        linear-gradient(
          #7658d5,
          #4d359d
        );
      border: 3px solid #ffe9a0;
      border-radius: 13px;
      font-weight: 900;
    }

    .cards {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(90px, 1fr)
        );
      gap: 7px;
      padding: 10px;
    }

    .card {
      min-height: 74px;
      padding: 8px;
      text-align: center;
      background: #302851;
      border: 3px solid #aaa;
      border-radius: 9px;
    }

    .card.SR {
      border-color: #c56eff;
    }

    .card.SSR {
      border-color: #ffe15d;
      box-shadow: 0 0 16px #ffbe32;

    /* 下部ナビ */

  </style>

<script>
  "use strict";

  const $ = (id) =>
    document.getElementById(id);

  const SAVE_KEY =
    "starSwordCompleteV5";

  const TREE_SIZE = 3300;

  const TREE_CENTER = {
    x: TREE_SIZE / 2,
    y: TREE_SIZE / 2
  };

  function createNewGame() {
    return {
      level: 1,
      exp: 0,
      gold: 120,
      crystal: 1000,
      soul: 80,
      stage: 1,
      attackLevel: 0,
      defenseLevel: 0,
      rebirths: 0,
      idleBank: 0,
      lastSave: Date.now(),
      tree: {
        core: 1
      },
      items: []
    };
  }

  let game = createNewGame();

  try {
    game = {
      ...game,
      ...JSON.parse(
        localStorage.getItem(
          SAVE_KEY
        ) || "{}"
      )
    };
  } catch (error) {
    console.error(error);
  }

  if (
    !game.tree ||
    Array.isArray(game.tree)
  ) {
    game.tree = {
      core: 1
    };
  }

  if (!game.tree.core) {
    game.tree.core = 1;
  }

  if (!Array.isArray(game.items)) {
    game.items = [];
  }

  function saveGame() {
    game.lastSave = Date.now();

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(game)
    );
  }

  function formatNumber(value) {
    return Math.floor(value)
      .toLocaleString("ja-JP");
  }

  /* 紋章 */

  const iconMap = {
    core: ["✦", "rebirth"],
    war: ["♠", "war"],
    sword: ["⚔", "sword"],
    guard: ["◆", "guard"],
    magic: ["✧", "magic"],
    fate: ["✦", "fate"],
    astral: ["◆", "astral"],
    rebirth: ["∞", "rebirth"],
    death: ["☠", "death"],
    fire: ["♨", "fire"],
    thunder: ["ϟ", "thunder"],
    moon: ["☾", "moon"]
  };

  function createEmblem(
    type,
    size = ""
  ) {
    const design =
      iconMap[type] ||
      iconMap.fate;

    return `
      <span class="rpg-icon ${design[1]} ${size}">
        ${design[0]}
      </span>
    `;
  }

  /* スキルツリー */

  const treeNodes = [
    {
      id: "core",
      name: "星魂の核",
      icon: "core",
      type: "core",
      size: "core",
      x: TREE_CENTER.x,
      y: TREE_CENTER.y,
      maxRank: 1,
      baseCost: 0,
      effect: "none",
      value: 0,
      required: null,
      description:
        "すべての星魂能力の起点。"
    }
  ];

  const treeEdges = [];

  const branches = [
    {
      id: "war",
      angle: -155,
      effect: "attack",
      icon: "war",
      keystone: "death",
      names: [
        "猛攻",
        "剣気",
        "裂傷",
        "破甲",
        "連撃",
        "会心眼",
        "怒涛",
        "武神",
        "狂戦士",
        "処刑星"
      ]
    },
    {
      id: "guard",
      angle: 155,
      effect: "defense",
      icon: "guard",
      keystone: "guard",
      names: [
        "生命",
        "堅牢",
        "再生",
        "鉄壁",
        "耐性",
        "活力",
        "聖域",
        "不屈",
        "守護神",
        "不死星"
      ]
    },
    {
      id: "magic",
      angle: -90,
      effect: "magic",
      icon: "magic",
      keystone: "magic",
      names: [
        "魔力",
        "元素",
        "集中",
        "高速詠唱",
        "炎術",
        "雷術",
        "氷術",
        "秘術",
        "大魔導",
        "星界魔法"
      ]
    },
    {
      id: "fate",
      angle: 90,
      effect: "idle",
      icon: "fate",
      keystone: "moon",
      names: [
        "黄金律",
        "経験知",
        "幸運",
        "時流",
        "祝福",
        "繁栄",
        "加速",
        "星の恩寵",
        "運命改変",
        "豊穣星"
      ]
    },
    {
      id: "astral",
      angle: -25,
      effect: "loot",
      icon: "astral",
      keystone: "astral",
      names: [
        "星石",
        "宝運",
        "装備共鳴",
        "希少発見",
        "秘宝",
        "星光",
        "水晶共鳴",
        "星辰",
        "奇跡",
        "天星"
      ]
    },
    {
      id: "rebirth",
      angle: 25,
      effect: "rebirth",
      icon: "rebirth",
      keystone: "rebirth",
      names: [
        "魂",
        "記憶",
        "輪廻",
        "再誕",
        "転生",
        "超越",
        "永劫",
        "星魂",
        "神化",
        "無限輪廻"
      ]
    }
  ];

  function getSideIcon(type, number) {
    if (type === "war") {
      return number % 3
        ? "sword"
        : "fire";
    }

    if (type === "magic") {
      return [
        "magic",
        "fire",
        "thunder",
        "moon"
      ][number % 4];
    }

    if (type === "fate") {
      return number % 2
        ? "moon"
        : "fate";
    }

    if (type === "astral") {
      return "astral";
    }

    if (type === "rebirth") {
      return number % 4
        ? "rebirth"
        : "death";
    }

    return "guard";
  }

  function getSideEffect(type, number) {
    if (type === "war") {
      return number % 3
        ? "attack"
        : "bossDamage";
    }

    if (type === "guard") {
      return number % 2
        ? "defense"
        : "hp";
    }

    if (type === "magic") {
      return number % 2
        ? "magic"
        : "skillDamage";
    }

    if (type === "fate") {
      return number % 2
        ? "idle"
        : "gold";
    }

    if (type === "astral") {
      return number % 2
        ? "loot"
        : "crystal";
    }

    return number % 2
      ? "rebirth"
      : "soulGain";
  }

  function buildMainTree() {
    branches.forEach((branch) => {
      const angle =
        branch.angle *
        Math.PI /
        180;

      let previous = "core";

      for (
        let level = 1;
        level <= 10;
        level++
      ) {
        const distance =
          135 +
          level * 104;

        const curve =
          Math.sin(level * 1.32) *
          52;

        const x =
          TREE_CENTER.x +
          Math.cos(angle) *
          distance +
          Math.cos(
            angle +
            Math.PI / 2
          ) *
          curve;

        const y =
          TREE_CENTER.y +
          Math.sin(angle) *
          distance +
          Math.sin(
            angle +
            Math.PI / 2
          ) *
          curve;

        const id =
          `${branch.id}_main_${level}`;

        let size = "small";

        if (
          level === 4 ||
          level === 7
        ) {
          size = "medium";
        }

        if (level === 9) {
          size = "major";
        }

        if (level === 10) {
          size = "keystone";
        }

        treeNodes.push({
          id,
          name:
            branch.names[
              level - 1
            ],
          icon:
            level === 10
              ? branch.keystone
              : branch.icon,
          type:
            branch.id,
          size,
          x,
          y,
          maxRank:
            level >= 9
              ? 1
              : (
                  level === 4 ||
                  level === 7
                )
                ? 2
                : 3,
          baseCost:
            Math.max(
              1,
              Math.ceil(level / 2)
            ),
          effect:
            branch.effect,
          value:
            level === 10
              ? 0.3
              : level === 9
                ? 0.14
                : 0.025 +
                  level * 0.004,
          required: previous,
          description:
            `${branch.id}系統の能力を強化する。`
        });

        treeEdges.push({
          from: previous,
          to: id
        });

        if (level >= 2) {
          buildBranches(
            branch,
            id,
            x,
            y,
            angle,
            level
          );
        }

        previous = id;
      }
    });
  }

  function buildBranches(
    branch,
    parent,
    parentX,
    parentY,
    angle,
    level
  ) {
    const branchCount =
      level % 3 === 0
        ? 2
        : 1;

    for (
      let side = 0;
      side < branchCount;
      side++
    ) {
      let previous = parent;

      const direction =
        side === 0
          ? 1
          : -1;

      const length =
        2 +
        level % 2;

      for (
        let index = 1;
        index <= length;
        index++
      ) {
        const offset =
          72 *
          index *
          direction;

        const forward =
          34 *
          index;

        const x =
          parentX +
          Math.cos(angle) *
          forward +
          Math.cos(
            angle +
            Math.PI / 2
          ) *
          offset;

        const y =
          parentY +
          Math.sin(angle) *
          forward +
          Math.sin(
            angle +
            Math.PI / 2
          ) *
          offset;

        const id =
          `${branch.id}_side_${level}_${side}_${index}`;

        const major =
          index === length &&
          level % 4 === 0;

        treeNodes.push({
          id,
          name:
            `${
              branch.names[
                (
                  level +
                  index
                ) %
                branch.names.length
              ]
            }・派生`,
          icon:
            major
              ? branch.icon
              : getSideIcon(
                  branch.id,
                  level +
                  index
                ),
          type: branch.id,
          size:
            major
              ? "major"
              : "small",
          x,
          y,
          maxRank:
            major
              ? 1
              : 2,
          baseCost:
            Math.max(
              1,
              Math.ceil(level / 3)
            ),
          effect:
            getSideEffect(
              branch.id,
              level +
              index
            ),
          value:
            major
              ? 0.13
              : 0.025,
          required: previous,
          description:
            "メイン系統から派生した特殊能力。"
        });

        treeEdges.push({
          from: previous,
          to: id
        });

        previous = id;
      }
    }
  }

  /* 外周100ノード */

  function buildOuterTree() {
    const rings = [
      {
        count: 40,
        radius: 900,
        prefix: "A"
      },
      {
        count: 36,
        radius: 1120,
        prefix: "B"
      },
      {
        count: 24,
        radius: 1350,
        prefix: "C"
      }
    ];

    const types =
      branches.map(
        (branch) => branch.id
      );

    let previousRing = [];

    rings.forEach(
      (ring, ringIndex) => {
        const currentRing = [];

        for (
          let index = 0;
          index < ring.count;
          index++
        ) {
          const angle =
            index /
            ring.count *
            Math.PI *
            2 -
            Math.PI /
            2;

          const radius =
            ring.radius +
            Math.sin(
              index * 1.73 +
              ringIndex
            ) *
            50;

          const x =
            TREE_CENTER.x +
            Math.cos(angle) *
            radius;

          const y =
            TREE_CENTER.y +
            Math.sin(angle) *
            radius;

          const type =
            types[
              index %
              types.length
            ];

          const branch =
            branches.find(
              (item) =>
                item.id === type
            );

          const id =
            `outer_${ring.prefix}_${index}`;

          const keystone =
            ringIndex === 2 &&
            index % 6 === 0;

          const major =
            index % 8 === 0;

          let required;

          if (ringIndex === 0) {
            required =
              `${type}_main_${7 + index % 4}`;
          } else {
            required =
              previousRing[
                Math.floor(
                  index /
                  ring.count *
                  previousRing.length
                ) %
                previousRing.length
              ];
          }

          treeNodes.push({
            id,
            name:
              `${
                [
                  "覇王",
                  "聖域",
                  "創世",
                  "運命",
                  "天晶",
                  "永劫"
                ][index % 6]
              }星座 ${index + 1}`,
            icon:
              keystone
                ? branch.keystone
                : getSideIcon(
                    type,
                    index
                  ),
            type,
            size:
              keystone
                ? "keystone"
                : major
                  ? "major"
                  : "small",
            x,
            y,
            maxRank:
              keystone
                ? 1
                : major
                  ? 2
                  : 3,
            baseCost:
              5 +
              ringIndex * 3 +
              (
                keystone
                  ? 5
                  : 0
              ),
            effect:
              getSideEffect(
                type,
                index
              ),
            value:
              keystone
                ? 0.35
                : major
                  ? 0.12
                  : 0.035,
            required,
            description:
              "外周星座に属する上位能力。"
          });

          treeEdges.push({
            from: required,
            to: id
          });

          if (index > 0) {
            treeEdges.push({
              from:
                currentRing[
                  index - 1
                ],
              to: id
            });
          }

          currentRing.push(id);
        }

        treeEdges.push({
          from:
            currentRing[
              currentRing.length - 1
            ],
          to:
            currentRing[0]
        });

        previousRing =
          currentRing;
      }
    );
  }

  buildMainTree();
  buildOuterTree();

  function getRank(id) {
    return Number(
      game.tree[id] || 0
    );
  }

  function isAvailable(node) {
    if (node.id === "core") {
      return true;
    }

    return (
      getRank(node.required) >
      0
    );
  }

  function getNodeCost(node) {
    return (
      node.baseCost +
      getRank(node.id)
    );
  }

  function getTreeBonus(effect) {
    return treeNodes.reduce(
      (total, node) => {
        if (
          node.effect !== effect
        ) {
          return total;
        }

        return (
          total +
          getRank(node.id) *
          node.value
        );
      },
      0
    );
  }

  function calculateStats() {
    const permanent =
      1 +
      game.rebirths * 0.12 +
      getTreeBonus("rebirth");

    const itemPower =
      game.items.reduce(
        (total, item) =>
          total +
          item.power,
        0
      );

    const attack =
      (
        25 +
        game.level * 7 +
        game.attackLevel * 8
      ) *
      permanent *
      (
        1 +
        getTreeBonus("attack")
      );

    const defense =
      (
        10 +
        game.level * 3 +
        game.defenseLevel * 6
      ) *
      permanent *
      (
        1 +
        getTreeBonus("defense")
      );

    const hp =
      (
        180 +
        game.level * 35
      ) *
      permanent *
      (
        1 +
        getTreeBonus("hp") +
        getTreeBonus("defense") *
        0.35
      );

    return {
      attack:
        Math.floor(
          attack +
          itemPower
        ),
      defense:
        Math.floor(
          defense +
          itemPower / 2
        ),
      hp:
        Math.floor(
          hp +
          itemPower * 3
        ),
      power:
        Math.floor(
          attack * 14 +
          defense * 10 +
          hp * 2 +
          itemPower * 20
        )
    };
  }

  /* ツリー描画 */

  let activeFilter = "all";

  function renderTree() {
    const container =
      $("treeNodes");

    container.innerHTML = "";

    treeNodes.forEach((node) => {
      const rank =
        getRank(node.id);

      const state =
        rank > 0
          ? "owned"
          : isAvailable(node)
            ? "available"
            : "locked";

      const button =
        document.createElement(
          "button"
        );

      button.className =
        `tree-node ${node.type} ${node.size} ${state}`;

      if (
        rank >= node.maxRank
      ) {
        button.classList.add(
          "maxed"
        );
      }

      button.style.left =
        `${node.x}px`;

      button.style.top =
        `${node.y}px`;

      button.dataset.id =
        node.id;

      button.dataset.name =
        node.name;

      button.dataset.type =
        node.type;

      button.innerHTML =
        createEmblem(node.icon);

      button.onclick =
        (event) => {
          event.stopPropagation();
          selectNode(node);
        };

      container.appendChild(button);
    });

    renderLines();
    applyFilter();
    applySearch();
  }

  function renderLines() {
    const svg =
      $("treeLines");

    svg.innerHTML = "";

    treeEdges.forEach((edge) => {
      const from =
        treeNodes.find(
          (node) =>
            node.id === edge.from
        );

      const to =
        treeNodes.find(
          (node) =>
            node.id === edge.to
        );

      if (!from || !to) {
        return;
      }

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      let className =
        "tree-line";

      if (
        getRank(to.id) > 0
      ) {
        className += " active";
      } else if (
        isAvailable(to)
      ) {
        className += " available";
      }

      line.setAttribute(
        "x1",
        from.x
      );

      line.setAttribute(
        "y1",
        from.y
      );

      line.setAttribute(
        "x2",
        to.x
      );

      line.setAttribute(
        "y2",
        to.y
      );

      line.setAttribute(
        "class",
        className
      );

      svg.appendChild(line);
    });
  }

  function selectNode(node) {
    document
      .querySelectorAll(
        ".tree-node"
      )
      .forEach((element) => {
        element.classList.toggle(
          "selected",
          element.dataset.id ===
            node.id
        );
      });

    const rank =
      getRank(node.id);

    const cost =
      getNodeCost(node);

    const disabled =
      node.id === "core" ||
      rank >= node.maxRank ||
      !isAvailable(node) ||
      game.soul < cost;

    let buttonText =
      `強化 ✦${cost}`;

    if (node.id === "core") {
      buttonText =
        "起点ノード";
    } else if (
      rank >= node.maxRank
    ) {
      buttonText =
        "最大ランク";
    } else if (
      !isAvailable(node)
    ) {
      buttonText =
        "前提ノードが必要";
    } else if (
      game.soul < cost
    ) {
      buttonText =
        `星魂不足 ✦${cost}`;
    }

    $("nodeDetail").innerHTML = `
      ${createEmblem(
        node.icon,
        "medium"
      )}

      <div>
        <b>${node.name}</b>

        <p>${node.description}</p>

        <p>
          Rank ${rank}/${node.maxRank}
          ・効果
          +${Math.round(
            node.value * 100
          )}%
        </p>

        <button
          id="buyNode"
          ${disabled ? "disabled" : ""}
        >
          ${buttonText}
        </button>
      </div>
    `;

    const buyButton =
      $("buyNode");

    if (buyButton) {
      buyButton.onclick =
        () =>
          purchaseNode(node);
    }
  }

  function purchaseNode(node) {
    const rank =
      getRank(node.id);

    const cost =
      getNodeCost(node);

    if (
      !isAvailable(node) ||
      rank >= node.maxRank ||
      game.soul < cost
    ) {
      return;
    }

    game.soul -= cost;

    game.tree[node.id] =
      rank + 1;

    saveGame();
    renderGame();
    renderTree();
    selectNode(node);

    showToast(
      `${node.name}を強化！`
    );
  }

  $("resetTree").onclick =
    () => {
      let refund = 0;

      treeNodes.forEach((node) => {
        if (
          node.id === "core"
        ) {
          return;
        }

        const rank =
          getRank(node.id);

        for (
          let index = 0;
          index < rank;
          index++
        ) {
          refund +=
            node.baseCost +
            index;
        }
      });

      if (
        refund <= 0 ||
        !confirm(
          `星魂${refund}個を払い戻しますか？`
        )
      ) {
        return;
      }

      game.soul += refund;

      game.tree = {
        core: 1
      };

      saveGame();
      renderGame();
      renderTree();

      showToast(
        "星魂盤を初期化"
      );

  /* ツリー移動・ズーム */

  let treeScale = 0.58;
  let treeX = 0;
  let treeY = 0;

  let dragging = false;
  let startX = 0;
  let startY = 0;
  let startTreeX = 0;
  let startTreeY = 0;

  const viewport =
    $("treeViewport");

  const world =
    $("treeWorld");

  function updateTreeTransform() {
    world.style.transform =
      `translate(${treeX}px,${treeY}px) scale(${treeScale})`;

    $("zoomDisplay").textContent =
      `${Math.round(
        treeScale * 100
      )}%`;
  }

  function centerTree() {
    treeX =
      viewport.clientWidth / 2 -
      TREE_CENTER.x *
      treeScale;

    treeY =
      viewport.clientHeight / 2 -
      TREE_CENTER.y *
      treeScale;

    updateTreeTransform();
  }

  viewport.onpointerdown =
    (event) => {
      if (
        event.target.closest(
          ".tree-node"
        )
      ) {
        return;
      }

      dragging = true;

      startX =
        event.clientX;

      startY =
        event.clientY;

      startTreeX =
        treeX;

      startTreeY =
        treeY;

      viewport.setPointerCapture(
        event.pointerId
      );
    };

  viewport.onpointermove =
    (event) => {
      if (!dragging) {
        return;
      }

      treeX =
        startTreeX +
        event.clientX -
        startX;

      treeY =
        startTreeY +
        event.clientY -
        startY;

      updateTreeTransform();
    };

  viewport.onpointerup =
    () => {
      dragging = false;
    };

  viewport.onwheel =
    (event) => {
      event.preventDefault();

      treeScale +=
        event.deltaY < 0
          ? 0.06
          : -0.06;

      treeScale =
        Math.max(
          0.25,
          Math.min(
            1.5,
            treeScale
          )
        );

      updateTreeTransform();
    };

  $("zoomIn").onclick =
    () => {
      treeScale =
        Math.min(
          1.5,
          treeScale + 0.1
        );

      updateTreeTransform();
    };

  $("zoomOut").onclick =
    () => {
      treeScale =
        Math.max(
          0.25,
          treeScale - 0.1
        );

      updateTreeTransform();
    };

  $("centerTree").onclick =
    centerTree;

  /* プレイヤーHP */

  let battleInProgress = false;
  let battleTimer = null;

  let playerCurrentHp = 0;
  let playerMaximumHp = 1;

  function updatePlayerHpDisplay() {
    playerCurrentHp =
      Math.max(
        0,
        Math.min(
          playerCurrentHp,
          playerMaximumHp
        )
      );

    const percentage =
      playerCurrentHp /
      playerMaximumHp *
      100;

    $("playerCurrentHp")
      .textContent =
      formatNumber(
        playerCurrentHp
      );

    $("playerMaximumHp")
      .textContent =
      formatNumber(
        playerMaximumHp
      );

    $("playerHpBar")
      .style
      .width =
      `${percentage}%`;

    const shell =
      $("playerHpShell");

    shell.classList.toggle(
      "warning",
      percentage <= 50 &&
      percentage > 25
    );

    shell.classList.toggle(
      "danger",
      percentage <= 25
    );
  }

  function playPlayerHit() {
    const unit =
      $("playerUnit");

    unit.classList.remove("hit");
    void unit.offsetWidth;
    unit.classList.add("hit");
  }

  function showDamage(value) {

      $("damageNumber");

    element.classList.remove(
      "show"
    );

    void element.offsetWidth;

    element.classList.add(
      "show"
    );

  function showBattleEffect(symbol) {

      $("battleEffect");

    element.textContent =

    element.classList.remove(
      "show"
    );

    void element.offsetWidth;

    element.classList.add(

  /* 戦闘 */

  $("fight").onclick =
    () => {
      if (battleInProgress) {
        return;
      }

      battleInProgress = true;
      $("fight").disabled = true;

      const stats =
        calculateStats();

      const enemyMaximumHp =
        Math.floor(
          180 *
          Math.pow(
            1.28,
            game.stage - 1
          )
        );

      let enemyCurrentHp =
        enemyMaximumHp;

      let turn = 0;

      playerMaximumHp =
        stats.hp;

      playerCurrentHp =
        playerMaximumHp;

      updatePlayerHpDisplay();

      $("enemyMaximumHp")
        .textContent =
        formatNumber(
          enemyMaximumHp
        );

      $("enemyCurrentHp")
        .textContent =
        formatNumber(
          enemyCurrentHp
        );

      $("enemyHpBar")
        .style
        .width =
        "100%";

      $("battleLog").textContent =
        "戦闘開始！";

      battleTimer =
        setInterval(() => {
          turn++;

          const multipliers = [
            1,
            1.2 +
            getTreeBonus("magic") *
            0.3,
            1.15 +
            getTreeBonus(
              "skillDamage"
            ),
            1.6 +
            getTreeBonus("magic") *
            0.5
          ];

          const multiplier =
            multipliers[
              (
                turn - 1
              ) %
              multipliers.length
            ];

          const damage =
            Math.floor(
              stats.attack *
              multiplier *
              (
                1 +
                getTreeBonus(
                  "bossDamage"
                )
              ) *
              (
                0.9 +
                Math.random() *
                0.2
              )
            );

          enemyCurrentHp -=
            damage;

          showDamage(damage);

          showBattleEffect(
            [
              "⚔",
              "♨",
              "ϟ",
              "✦"
            ][
              (
                turn - 1
              ) %
              4
            ]
          );

          $("enemyCurrentHp")
            .textContent =
            formatNumber(
              Math.max(
                0,
                enemyCurrentHp
              )
            );

          $("enemyHpBar")
            .style
            .width =
            `${
              Math.max(
                0,
                enemyCurrentHp /
                enemyMaximumHp *
                100
              )
            }%`;

          if (enemyCurrentHp <= 0) {
            clearInterval(
              battleTimer
            );

            winBattle();

            return;
          }

          const enemyDamage =
            Math.max(
              3,
              Math.floor(
                18 +
                game.stage * 9 -
                stats.defense *
                0.32
              )
            );

          playerCurrentHp -=
            enemyDamage;

          updatePlayerHpDisplay();
          playPlayerHit();

          $("battleLog").textContent =
            `敵の攻撃！ ${formatNumber(enemyDamage)}ダメージ`;

          if (playerCurrentHp <= 0) {
            clearInterval(
              battleTimer
            );

            battleInProgress =
              false;

            $("fight").disabled =
              false;

            $("battleLog")
              .textContent =
              "敗北。強化や星魂盤を見直そう。";
          }
        }, 620);
    };

  function winBattle() {
    const goldReward =
      Math.floor(
        (
          40 +
          game.stage * 18
        ) *
        (
          1 +
          getTreeBonus("gold")
        )
      );

    const expReward =
      Math.floor(
        (
          45 +
          game.stage * 12
        ) *
        (
          1 +
          getTreeBonus("idle") *
          0.25
        )
      );

    const crystalReward =
      Math.max(
        15,
        Math.floor(
          15 *
          (
            1 +
            getTreeBonus(
              "crystal"
            )
          )
        )
      );

    game.gold += goldReward;
    game.exp += expReward;
    game.crystal += crystalReward;
    game.stage++;

    while (
      game.exp >=
      game.level * 100
    ) {
      game.exp -=
        game.level * 100;

      game.level++;
    }

    battleInProgress = false;
    $("fight").disabled = false;

    $("battleLog").textContent =
      `勝利！ +${formatNumber(goldReward)}G +${formatNumber(expReward)}EXP +${crystalReward}◆`;

    saveGame();
    renderGame();
  }

  /* ガチャ */

  const itemNames = [
    "星剣アルディオン",
    "月影の魔導書",
    "天星の弓",
    "輪廻の指輪",

  function summon(count, price) {
    if (
      game.crystal < price
    ) {
      showToast(
        "クリスタル不足"
      );
      return;
    }

    game.crystal -= price;

    const results = [];

    for (
      let index = 0;
      index < count;
      index++
    ) {
      const random =
        Math.random();

      let rarity =
        random < 0.05
          ? "SSR"
          : random < 0.28
            ? "SR"
            : "R";

      if (
        count === 10 &&
        index === 9 &&
        rarity === "R"
      ) {
        rarity = "SR";
      }

      const item = {
        name:
          itemNames[
            Math.floor(
              Math.random() *
              itemNames.length
            )
          ],
        rarity,
        power: {
          R: 6,
          SR: 15,
          SSR: 35
        }[rarity]
      };

      game.items.push(item);
      results.push(item);
    }

    $("gachaResults")
      .innerHTML =
      itemCards(results);

    saveGame();
    renderGame();

    showToast(
      `${count}回召喚した！`
    );
  }

      .slice()
      .reverse()
      .map((item) => `
        <div class="card ${item.rarity}">
          <b>${item.rarity}</b>
          <br>
          ${item.name}
          <br>
          <small>
            戦力+${item.power}
          </small>
        </div>
      `)
      .join("");
  }

  /* 転生 */

  function soulGain() {
    if (game.stage < 10) {
      return 0;
    }

    return Math.max(
      1,
      Math.floor(
        game.stage /
        5 *
        (
          1 +
          getTreeBonus(
            "soulGain"
          )
        )
      )
    );
  }

  $("rebirthButton").onclick =
    () => {
      if (game.stage < 10) {
        showToast(
          "Stage 10で解放"
        );
        return;
      }

      const gain =
        soulGain();

      if (
        !confirm(
          `転生して星魂${gain}個を得ますか？`
        )
      ) {
        return;
      }

      game.soul += gain;
      game.rebirths++;

      game.level = 1;
      game.exp = 0;
      game.gold = 120;
      game.stage = 1;
      game.attackLevel = 0;
      game.defenseLevel = 0;
      game.idleBank = 0;

      saveGame();
      renderGame();
      renderTree();

      showToast(
        "転生した！"
      );
    };

  /* 描画 */

  function renderGame() {
    const stats =
      calculateStats();

    const requiredExp =
      game.level * 100;

    $("level").textContent =
      game.level;

    $("gold").textContent =
      formatNumber(game.gold);

    $("crystal").textContent =
      formatNumber(game.crystal);

    $("gachaCrystal")
      .textContent =
      formatNumber(game.crystal);

    $("soul").textContent =
      formatNumber(game.soul);

    $("treeSoul").textContent =
      formatNumber(game.soul);

    $("stage").textContent =
      game.stage;

    $("power").textContent =
      formatNumber(stats.power);

    $("hpStat").textContent =
      formatNumber(stats.hp);

    $("attackStat").textContent =
      formatNumber(stats.attack);

    $("defenseStat").textContent =
      formatNumber(stats.defense);

    $("exp").textContent =
      formatNumber(game.exp);

    $("expRequired").textContent =
      formatNumber(requiredExp);

    $("expBar").style.width =
      `${
        Math.min(
          100,
          game.exp /
          requiredExp *
          100
        )
      }%`;

    $("stageProgress")
      .style
      .width =
      `${
        (
          (
            game.stage - 1
          ) %
          5
        ) /
        4 *
        100
      }%`;

    $("attackLevel")
      .textContent =
      game.attackLevel;

    $("defenseLevel")
      .textContent =
      game.defenseLevel;

    $("attackCost")
      .textContent =
      formatNumber(
        attackCost()
      );

    $("defenseCost")
      .textContent =
      formatNumber(
        defenseCost()
      );

    $("idleGold")
      .textContent =
      formatNumber(
        game.idleBank
      );

    $("rebirthCount")
      .textContent =
      game.rebirths;

    $("permanentMultiplier")
      .textContent =
      `${
        (
          1 +
          game.rebirths * 0.12 +
          getTreeBonus("rebirth")
        ).toFixed(2)
      }x`;

    $("rebirthSoulGain")
      .textContent =
      soulGain();

    $("rebirthButton").disabled =
      game.stage < 10;

    $("gachaHistory")
      .innerHTML =
      itemCards(
        game.items.slice(-20)
      );

    if (!battleInProgress) {
      playerMaximumHp =
        stats.hp;

      playerCurrentHp =
        playerMaximumHp;

      updatePlayerHpDisplay();
    }
  }

  /* ページ切替 */

  function openPage(id) {
    document
      .querySelectorAll(".page")
      .forEach((page) => {
        page.classList.remove(
          "active"
        );
      });

    $(id).classList.add(
      "active"
    );

    document
      .querySelectorAll(
        ".bottom-nav button"
      )
      .forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.page === id
        );
      });

    if (id === "tree") {
      renderTree();

      setTimeout(
        centerTree,
        0
      );
    }

    window.scrollTo(0, 0);
  }

  /* 通知 */

  let toastTimer;

  function showToast(message) {
    $("toast").textContent =
      message;

    $("toast").classList.add(
      "show"
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(() => {
        $("toast")
          .classList
          .remove("show");
      }, 1700);
  }

  /* オフライン報酬 */

  const elapsed =
    Math.min(
      8 * 60 * 60,
      Math.max(
        0,
        (
          Date.now() -
          game.lastSave
        ) /
        1000
      )
    );

  game.idleBank +=
    Math.floor(
      elapsed *
      idleRate()
    );

  setInterval(() => {
    game.idleBank +=
      Math.max(
        1,
        Math.floor(
          idleRate()
        )
      );

    $("idleGold")
      .textContent =
      formatNumber(
        game.idleBank
      );
  }, 1000);

  setInterval(
    saveGame,
    15000
  );

  window.addEventListener(
    "beforeunload",
    saveGame
  );

  saveGame();
  renderGame();
  renderTree();
  openPage("adventure");
</script>

</body>
</html>
